server {
    # Ayrıcalıksız port: root olmayan nginx, net.ipv4.ip_unprivileged_port_start
    # ayarına bağlı kalmadan her ortamda (rootless Docker, Kubernetes) bağlanabilsin.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer ki
    # istemci tarafı yönlendirme çalışsın.
    # API ters vekil: tarayıcı aynı kaynağa (/api) konuşur, CORS gerekmez.
    # Docker DNS'i yeniden çözümlesin diye değişken kullanılır (api yeniden başlatılabilir).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # service worker ve manifest her zaman güncel okunmalı (yoksa eski kabuk takılı kalır)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # İçeriği hash'li varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
