server {
    # Ayrıcalıksız port: root olmayan nginx, net.ipv4.ip_unprivileged_port_start
    # ayarına bağlı kalmadan her ortamda (rootless Docker, Kubernetes) bağlanabilsin.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer ki
    # istemci tarafı yönlendirme çalışsın.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # İçeriği hash'li varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
