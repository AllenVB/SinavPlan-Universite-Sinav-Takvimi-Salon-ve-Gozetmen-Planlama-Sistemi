# golangci-lint yapılandırması.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose     # HTTP yanıt gövdesi kapatılmazsa bağlantı sızar
    - rowserrcheck  # sql.Rows.Err() kontrol edilmezse sessiz veri kaybı olur
    - sqlclosecheck
    - revive
    # misspell bilerek kapalı: kod ve yorumlar Türkçe; İngilizce sözlükle yanlış alarm veriyor
    # ("sığmamalı" -> "mamal", "Performans" -> "Performances").

issues:
  exclude-dirs:
    - internal/store/sqlc   # üretilen kod
  exclude-rules:
    # Testlerde okunabilirlik için bazı kurallar gevşetilir.
    - path: _test\.go
      linters: [errcheck, revive]
