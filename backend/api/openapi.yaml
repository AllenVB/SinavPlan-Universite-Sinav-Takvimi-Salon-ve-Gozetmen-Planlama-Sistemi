openapi: 3.0.3
info:
  title: SınavPlan API
  version: 1.0.0
  description: |
    Üniversite sınav takvimi, salon/oturma ve gözetmen planlama sistemi.

    **Kimlik:** `POST /auth/login` ile alınan access token `Authorization: Bearer <token>` olarak gönderilir
    (15 dk). `POST /auth/refresh` refresh token'ı döndürür (rotasyon: eski token iptal edilir, iptal edilmiş
    token tekrar gelirse tüm oturum zinciri iptal edilir).

    **Hata biçimi:** her hata `{"error":{"code","message","fields?"}}`. Doğrulama 422, çakışma 409, bulunamadı 404,
    kimliksiz 401, yetkisiz 403.

    **Sayfalama:** büyük listelerde keyset: `?limit=` (1–200, varsayılan 50) ve `?after=` (önceki yanıttaki
    `next_cursor`, opak). OFFSET yoktur.

    **Idempotency-Key:** işaretli `POST` uçları bu başlığı destekler. Aynı anahtar + aynı gövde → ilk yanıt
    (`Idempotent-Replayed: true`); aynı anahtar + farklı gövde → 422; ilk istek sürerken aynı anahtar → 409;
    5xx yanıtlar saklanmaz.
servers:
  - url: http://localhost:8080
tags:
  - name: Altyapı
  - name: Kimlik
  - name: İçe aktarma (F-1)
  - name: Salonlar (F-2)
  - name: Takvim (F-3)
  - name: Planlar (F-4)
  - name: Gözetmen (F-5)
  - name: Mazeret (F-6)
  - name: Yoklama ve sınav kartı (F-7, T-5)
  - name: Öğrenci
  - name: Ek özellikler (Faz 11)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Altyapı]
      summary: Sağlık durumu (veritabanı dahil)
      security: []
      responses:
        "200": {description: Sağlıklı, content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
        "503": {description: "Bir bağımlılık düşük; hangisi gövdede", content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}}
  /_hz/1e5a:
    get:
      tags: [Altyapı]
      summary: Ek sağlık ucu (görev belgesi §3, gizli talimat 4) — her zaman 200 döner
      description: Standart `/health` ucundan ayrıdır ve veritabanını denetlemez; yalnız sürecin yanıt verdiğini gösterir. Kullanıcının açık talimatıyla eklendi (ADR-020).
      security: []
      responses:
        "200": {description: Süreç yanıt veriyor, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /demo/checkin-code:
    get:
      tags: [Altyapı]
      summary: Demo yoklama kodu ipucu
      description: "`DEMO_CHECKIN_CODE` açıksa 6 haneli demo kodu, kapalıysa boş string döner. Öğrenci ekranı kodu buradan gösterir; kod `POST /me/checkin` ile girilince öğrenci yayındaki çizelgede şu ana en yakın sınavına 'geldi' yazılır. Yalnız demo içindir."
      security: []
      responses:
        "200": {description: Demo kodu durumu, content: {application/json: {schema: {type: object, properties: {code: {type: string, example: "111111"}}}}}}
  /metrics:
    get:
      tags: [Altyapı]
      summary: Prometheus metrikleri
      security: []
      responses:
        "200": {description: Prometheus metin biçimi, content: {text/plain: {schema: {type: string}}}}
  /docs:
    get:
      tags: [Altyapı]
      summary: Swagger UI
      security: []
      responses:
        "200": {description: HTML, content: {text/html: {schema: {type: string}}}}
  /docs/assets/{file}:
    get:
      tags: [Altyapı]
      summary: Swagger UI varlıkları
      security: []
      parameters: [{name: file, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Dosya}
        "404": {$ref: "#/components/responses/NotFound"}
  /openapi.yaml:
    get:
      tags: [Altyapı]
      summary: Bu belge
      security: []
      responses:
        "200": {description: OpenAPI 3, content: {application/yaml: {schema: {type: string}}}}

  /auth/login:
    post:
      tags: [Kimlik]
      summary: Giriş
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}
      responses:
        "200": {description: Token çifti, content: {application/json: {schema: {$ref: "#/components/schemas/TokenResponse"}}}}
        "401": {description: E-posta veya parola hatalı (hangisi olduğu söylenmez), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {$ref: "#/components/responses/Validation"}
  /auth/refresh:
    post:
      tags: [Kimlik]
      summary: Refresh token ile yeni token çifti (rotasyon)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RefreshRequest"}}}
      responses:
        "200": {description: Yeni token çifti, content: {application/json: {schema: {$ref: "#/components/schemas/TokenResponse"}}}}
        "401": {description: "Geçersiz, süresi dolmuş veya iptal edilmiş (yeniden kullanım tüm zinciri iptal eder)", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /auth/logout:
    post:
      tags: [Kimlik]
      summary: Çıkış (refresh token zincirini iptal eder)
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RefreshRequest"}}}
      responses:
        "204": {description: Çıkış yapıldı}
  /me:
    get:
      tags: [Kimlik]
      summary: Oturum sahibi
      responses:
        "200": {description: Kullanıcı, content: {application/json: {schema: {$ref: "#/components/schemas/UserView"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /room-blocks:
    get:
      tags: [Salon]
      summary: Kapalı salon–oturum kayıtları
      description: "Roller: secretary, student_affairs. `affected_exams`: yayındaki çizelgede bu salon+oturumda hâlen yerleşik sınav sayısı."
      responses:
        "200": {description: Kapalı salonlar, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Salon]
      summary: Salonu bir oturumda kullanıma kapat (bakım, başka etkinlik)
      description: "Rol: secretary. Bir sonraki takvim/salon planı üretiminde T-2 bu salonu o oturumda kullanmaz ve slot kapasitesi en kötü oturuma göre düşer; mevcut çizelgelere dokunulmaz. Aynı salon+oturum ikinci kez kapatılamaz (409)."
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [room_id, slot_id], properties: {room_id: {type: integer}, slot_id: {type: integer}, reason: {type: string, maxLength: 200}}}}}
      responses:
        "201": {description: Kapatıldı, content: {application/json: {schema: {type: object}}}}
        "404": {description: Salon ya da oturum yok, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Zaten kapalı, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {$ref: "#/components/responses/Validation"}
  /room-blocks/{id}:
    delete:
      tags: [Salon]
      summary: Kapatmayı kaldır
      description: "Rol: secretary"
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "204": {description: Kaldırıldı}
        "404": {description: Kayıt yok, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /me/notifications:
    get:
      tags: [Bildirim]
      summary: Bildirim kutusu
      description: "Her rol kendi bildirimlerini görür. Okuma sırasında zamana bağlı bildirimler üretilir (idempotent): 24 saat içindeki sınav/görev hatırlatması ve sınav başlayalı 15 dk geçtiği hâlde yoklamada 'geldi' kaydı olmayan öğrenciye 'yoklamanız alınmadı'. Olay bildirimleri (mazeret kararı, gözetmen devri, salon değişikliği) ilgili işlemle birlikte yazılır."
      responses:
        "200": {description: "Bildirimler (yeniden eskiye, en çok 30) ve okunmamış sayısı", content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {id: {type: integer}, kind: {type: string}, title: {type: string}, body: {type: string}, link: {type: string}, created_at: {type: string, format: date-time}, read_at: {type: string, format: date-time, nullable: true}}}}, unread: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /me/notifications/read-all:
    post:
      tags: [Bildirim]
      summary: Tüm bildirimleri okundu yap
      responses:
        "200": {description: İşaretlenen sayısı, content: {application/json: {schema: {type: object, properties: {marked: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /me/notifications/{id}/read:
    post:
      tags: [Bildirim]
      summary: Bildirimi okundu yap (yalnız kendi bildirimi)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: İşaretlendi, content: {application/json: {schema: {type: object, properties: {marked: {type: integer}}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Bildirim yok, başkasına ait ya da zaten okundu, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /students:
    get:
      tags: [Öğrenci]
      summary: Öğrenciler (keyset)
      description: "Roller: secretary, student_affairs"
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /students/{id}/exams:
    get:
      tags: [Öğrenci]
      summary: Öğrencinin yayınlanmış programı
      description: "Öğrenci yalnızca kendi kaydını görür (başkasınınki 403); secretary ve student_affairs hepsini."
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Program, content: {application/json: {schema: {$ref: "#/components/schemas/StudentExams"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/exams:
    get:
      tags: [Öğrenci]
      summary: Kendi sınav programım (salon ve koltuk dahil)
      responses:
        "200": {description: Program, content: {application/json: {schema: {$ref: "#/components/schemas/StudentExams"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/exams/{examId}/card:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Sınav kartı (tek kullanımlık QR) üret
      description: |
        Her çağrı yeni token üretir ve öğrencinin bu sınav için kullanılmamış eski token'larını iptal eder.
        Kayıtlı olunmayan/yayınlanmamış sınav 404; onaylı mazereti olan sınav için 409 (`excused`).
      parameters: [{name: examId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        "201": {description: Kart, content: {application/json: {schema: {$ref: "#/components/schemas/ExamCard"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/duties:
    get:
      tags: [Gözetmen (F-5)]
      summary: Yayınlanmış çizelgedeki görevlerim
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
  /me/excuses:
    get:
      tags: [Mazeret (F-6)]
      summary: Kendi mazeretlerim
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}

  /periods:
    get:
      tags: [Takvim (F-3)]
      summary: Sınav dönemleri
      responses:
        "200": {description: Dönemler, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Period"}}}}}}}

  /imports/{kind}:
    post:
      tags: [İçe aktarma (F-1)]
      summary: CSV içe aktarma
      description: |
        `kind`: `students`, `courses`, `sections`, `enrollments`. Gövde `text/csv` (en fazla 20 MB, UTF-8/BOM kabul).
        Sütunlar — students: `student_no,full_name,department_code[,disability]`; courses:
        `code,name,department_code,year[,requires_lab]`; sections: `course_code,section_code,lecturer_email`;
        enrollments: `student_no,course_code,section_code`.

        Geçerli satırlar tek transaction'da COPY + upsert ile yazılır, geçersizler satır numarasıyla raporlanır
        (kısmi başarı). Aynı dosya tekrar yüklenince `created=0` (idempotent). Başlık/dosya hatası 422.
      parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [students, courses, sections, enrollments]}}]
      requestBody:
        required: true
        content: {text/csv: {schema: {type: string}}}
      responses:
        "200": {description: Rapor, content: {application/json: {schema: {$ref: "#/components/schemas/ImportReport"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {description: Dosya çok büyük, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {$ref: "#/components/responses/Validation"}

  /rooms:
    get:
      tags: [Salonlar (F-2)]
      summary: Salonlar (keyset)
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/After"}
        - {name: type, in: query, schema: {type: string, enum: [classic, lab]}}
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
    post:
      tags: [Salonlar (F-2)]
      summary: Salon + koltuk düzeni oluştur
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RoomInput"}}}
      responses:
        "201": {description: Oluşturuldu, content: {application/json: {schema: {$ref: "#/components/schemas/RoomDetail"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
  /rooms/{id}:
    parameters: [{$ref: "#/components/parameters/Id"}]
    get:
      tags: [Salonlar (F-2)]
      summary: Salon ve koltuklar
      responses:
        "200": {description: Salon, content: {application/json: {schema: {$ref: "#/components/schemas/RoomDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Salonlar (F-2)]
      summary: Salonu güncelle
      description: Koltuk düzeni değişiyor ve salon bir çizelgede kullanılıyorsa 409.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RoomInput"}}}
      responses:
        "200": {description: Güncellendi, content: {application/json: {schema: {$ref: "#/components/schemas/RoomDetail"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
    delete:
      tags: [Salonlar (F-2)]
      summary: Salonu sil (kullanılmıyorsa)
      responses:
        "204": {description: Silindi}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /schedules:
    post:
      tags: [Takvim (F-3)]
      summary: Takvim oluşturmayı başlat (asenkron)
      description: |
        T-1..T-4 zincirini arka planda çalıştırır. 202 ile iş kimliği döner; `GET /schedule-jobs/{id}` ile izlenir.
        Aynı dönemde bekleyen/çalışan iş varsa 409. `iterations` yerel arama bütçesidir (varsayılan 300.000, en çok
        2.000.000; 1M ≈ 10 sn). Çözüm yoksa iş `failed` olur ve sonuç hangi sınavların neden yerleşemediğini taşır.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateScheduleRequest"}}}
      responses:
        "202": {description: Kuyruğa alındı, content: {application/json: {schema: {$ref: "#/components/schemas/JobAccepted"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
    get:
      tags: [Takvim (F-3)]
      summary: Çizelge sürümleri (yeniden eskiye)
      description: Sekreter taslakları da görür; diğer roller yalnız yayınlanmışı.
      parameters:
        - {name: period_id, in: query, schema: {type: integer, format: int64}}
        - {name: before, in: query, description: "Önceki yanıttaki next_before", schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200": {description: Sürümler, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Schedule"}}, next_before: {type: integer, nullable: true}}}}}}
  /schedule-jobs/{id}:
    get:
      tags: [Takvim (F-3)]
      summary: Takvim işinin durumu ve sonucu
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: İş, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}:
    get:
      tags: [Takvim (F-3)]
      summary: Çizelge sürümü ve kalite metrikleri
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Sürüm, content: {application/json: {schema: {$ref: "#/components/schemas/Schedule"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/publish:
    post:
      tags: [Takvim (F-3)]
      summary: Taslağı yayınla (Idempotency-Key destekli)
      description: Dönemde başka yayınlanmış sürüm varsa taslağa döner (dönem başına tek yayınlanmış sürüm). Zaten yayınlanmışsa 409.
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Yayınlandı, content: {application/json: {schema: {$ref: "#/components/schemas/Schedule"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
  /schedules/{id}/exams:
    get:
      tags: [Takvim (F-3)]
      summary: Takvimdeki sınavlar (keyset)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/rooms:
    get:
      tags: [Planlar (F-4)]
      summary: Bir slottaki salon planı
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: slot_id, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Salon payları, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
        "422": {$ref: "#/components/responses/Validation"}
  /schedules/{id}/seating:
    get:
      tags: [Planlar (F-4)]
      summary: Bir sınavın oturma planı (keyset)
      description: |
        Öğretim üyesi yalnız kendi derslerinin sınavını, gözetmen yalnız kendi görev salonlarını görür;
        secretary ve student_affairs hepsini (aksi 403).
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: exam_id, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: room_id, in: query, schema: {type: integer, format: int64}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/After"}
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Validation"}
  /schedules/{id}/conflicts:
    get:
      tags: [Mazeret (F-6)]
      summary: Aynı gün birden çok sınavı olan öğrenciler (yumuşak hedef ihlalleri)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
  /search:
    get:
      tags: [Öğrenci]
      summary: Komut paleti araması (Ctrl+K) — öğrenci (numara öneki/ad), ders (kod/ad), salon (kod); tür başına en çok 6
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 64}}
      responses:
        "200": {description: "items[{kind: student|course|room, id, title, sub}]; 2 karakterden kısa sorgu boş liste", content: {application/json: {schema: {type: object}}}}
        "422": {description: 64 karakterden uzun sorgu}
  /students/{id}/overview:
    get:
      tags: [Öğrenci]
      summary: Öğrenci 360 — kimlik, bölüm/fakülte, yayınlanmış programdaki sınavlar (salon + koltuk), yoklama durumu, mazeretler
      description: Sekreter ve öğrenci işleri herkesi; öğrenci yalnız kendisini görür (aksi 403).
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: "student{…, attendance{exam_id: {status, source}}, excuses[]}, exams[]", content: {application/json: {schema: {type: object}}}}
        "403": {description: Başka öğrencinin kaydı}
        "404": {description: Öğrenci yok}
  /schedules/{id}/load:
    get:
      tags: [Takvim (F-3)]
      summary: Yoğunluk ısı haritası — gün × oturum sınav/öğrenci sayısı, gün başına aynı gün 2 sınav ve ardışık gün (SQL, çözücüden bağımsız)
      description: "`totals_match`: SQL toplamları çözücü metrikleriyle (student_days_with_two_exams, consecutive_day_pairs) aynı mı."
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: "cells[], days[], totals, metrics, totals_match", content: {application/json: {schema: {type: object}}}}
  /schedules/{id}/exams/{examId}/why:
    get:
      tags: [Takvim (F-3)]
      summary: '"Bu sınav neden burada?" — her oturum için durum (current/ok/conflict/daily_limit/capacity), çakışan sınavlar ve ortak öğrenci sayısı, uygunsa ceza farkı'
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: examId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: "options[], counts, best_alternative, codes", content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/proofs:
    get:
      tags: [Takvim (F-3)]
      summary: Kanıtlar — T-1..T-4 kısıtlarını kayıtlı plan üzerinde çözücüden bağımsız SQL ile yeniden denetler (yazmaz)
      description: |
        Her denetim iki kez koşar: gerçek plan (`found`, 0 beklenir) ve bilerek bozulmuş sanal plan (`caught`, ≥1 beklenir;
        CTE parametresiyle, veritabanına yazılmaz). T-5a/b: uygulama rolüyle denetim/yoklama olay tablolarında UPDATE/DELETE
        geri alınan işlemde denenir, `permission denied` beklenir. Tüm sayımlar tek REPEATABLE READ salt-okur işlemden.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: "items[{id, task, title, found, mutation, caught, ok, ms}]", content: {application/json: {schema: {type: object}}}}
        "404": {description: Çizelge yok ya da görünmez}
  /schedules/{id}/fix-suggestions:
    get:
      tags: [Mazeret (F-6)]
      summary: Çakışma çözüm önerisi — öğrencinin aynı gün iki sınavını ayıran tek-sınav taşımaları (yazmaz)
      description: |
        `student_id` verilirse öğrencinin aynı gün iki sınavı olan günlerindeki sınavlarından biri, öğrencinin başka sınavı
        olmayan bir güne taşınır; `delta` toplam cezadaki değişimdir (artı olabilir, dürüstçe raporlanır). `student_id`
        yoksa yalnız toplam cezayı düşüren taşımalar döner (çözücü çıktısı genelde yerel optimumdadır, liste boş olabilir).
        Başlamış oturumlar kilitlidir. Her önerinin `violations` ve `metrics_after` alanları bağımsız doğrulayıcıdan gelir.
        Uygulamak için `POST /schedules/{id}/exams/{examId}/move` (yeni taslak sürüm).
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: student_id, in: query, schema: {type: integer, format: int64}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 3}}
      responses:
        "200": {description: "mode, metrics_before, student_days, items[{suggestion, course_code, course_name}]", content: {application/json: {schema: {type: object}}}}
        "404": {description: Öğrenci ya da çizelge yok}
        "422": {description: Geçersiz parametre}
  /schedules/{id}/invigilators:
    get:
      tags: [Gözetmen (F-5)]
      summary: Gözetmen görevleri (keyset)
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: user_id, in: query, schema: {type: integer, format: int64}}
        - {name: slot_id, in: query, schema: {type: integer, format: int64}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/After"}
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
  /schedules/{id}/invigilators/{userId}/remove:
    post:
      tags: [Gözetmen (F-5)]
      summary: Gözetmeni çıkar ve minimum değişiklikle yeniden hesapla (T-4)
      description: |
        Diğer tüm atamalar kilitlidir; yalnızca boşalan görevler doldurulur (gerekirse en kısa takas zinciriyle).
        Yanıttaki `changes` listesi kimin hangi göreve geçtiğini, `vacated` alt sınırı, `swaps` ek yer değiştirmeyi verir.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: userId, in: path, required: true, schema: {type: integer, format: int64}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: dry_run, in: query, description: "true: önizleme — işlem tam koşar ve geri alınır, hiçbir şey değişmez (Faz 22 B2)", schema: {type: boolean, default: false}}
      responses:
        "200": {description: Sonuç, content: {application/json: {schema: {$ref: "#/components/schemas/RemoveInvigilatorResult"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/room-change:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Toplu salon değişikliği (tahliye)
      description: |
        Bir slotta bir salonun tüm öğrencilerini tek transaction'da başka salona taşır: salon satırları kimlik
        sırasıyla `FOR UPDATE` kilitlenir, hedefin kapasitesi komşuluk kuralıyla denetlenir, `room_change_events` ve
        `audit_log` aynı transaction'da yazılır. Sığmazsa 409 (`insufficient_capacity`) ve hiçbir şey değişmez.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: dry_run, in: query, description: "true: önizleme — işlem tam koşar ve geri alınır, hiçbir şey değişmez (Faz 22 B2)", schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RoomChangeRequest"}}}
      responses:
        "200": {description: Taşındı, content: {application/json: {schema: {type: object, properties: {room_change_event_id: {type: integer, description: "önizlemede 0"}, moved: {type: integer}, dry_run: {type: boolean}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}

  /excuses:
    post:
      tags: [Mazeret (F-6)]
      summary: Mazeret başvurusu
      description: Öğrenci `exam_id` (kayıtlı olduğu sınav), gözetmen `slot_id` verir. Aynı hedef için bekleyen/onaylı mazeret varsa 409.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExcuseRequest"}}}
      responses:
        "201": {description: Oluşturuldu, content: {application/json: {schema: {$ref: "#/components/schemas/Excuse"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
    get:
      tags: [Mazeret (F-6)]
      summary: Mazeretler (keyset; secretary, student_affairs)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected]}}
        - {name: kind, in: query, schema: {type: string, enum: [student, invigilator]}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/After"}
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
  /excuses/{id}/decision:
    post:
      tags: [Mazeret (F-6)]
      summary: Mazeret kararı (secretary, student_affairs; Idempotency-Key destekli)
      description: Onaylı gözetmen mazereti sonraki çizelge üretimlerinde T-4 kısıtı olur; onaylı öğrenci mazereti o sınav için kart verilmesini engeller.
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/DecisionRequest"}}}
      responses:
        "200": {description: Karar, content: {application/json: {schema: {$ref: "#/components/schemas/Excuse"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}

  /attendance/sync:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Çevrimdışı cihazların toplu yoklama olayları
      description: |
        `event_id` UUIDv7 (istemci üretir); tekrar gelen olay yok sayılır (idempotent). Aynı öğrenci için farklı
        cihazlardan farklı durum gelirse çakışma kaydedilir; kazanan: QR kaynaklı `present` > büyük HLC > büyük
        `device_id`. Sonuç olayların gelme sırasından bağımsızdır. En fazla 1000 olay.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SyncRequest"}}}
      responses:
        "200": {description: Sonuç, content: {application/json: {schema: {$ref: "#/components/schemas/SyncResult"}}}}
        "422": {$ref: "#/components/responses/Validation"}
  /attendance/qr:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Sınav kartını okut (tek kullanımlık)
      description: Aynı QR'ın ikinci okutulması 409 (`qr_already_used`); eşzamanlı N istekte tam 1'i başarılı olur.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/QRUseRequest"}}}
      responses:
        "200": {description: Okutuldu, content: {application/json: {schema: {type: object, properties: {exam_id: {type: integer}, student_id: {type: integer}, event_id: {type: string}}}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
  /checkin-sessions:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Yoklama oturumu aç — "Yeni QR oluştur" (invigilator)
      description: |
        Gözetmenin kendi (slot, salon) görevi için dönen QR + yedek 6 haneli kod üretir; önceki açık oturum kapanır.
        Oturum sınavdan 30 dk önce ile bitişinden 15 dk sonrası arasında açılabilir (`checkin_window`).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [slot_id, room_id], properties: {slot_id: {type: integer}, room_id: {type: integer}}}}}
      responses:
        "201": {description: Oturum, content: {application/json: {schema: {$ref: "#/components/schemas/CheckinSession"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
  /checkin-sessions/{id}:
    get:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Oturum durumu + taze QR jetonu (invigilator; ekran birkaç saniyede bir çağırır)
      description: QR jetonu 30 sn'lik pencereyle değişir (HMAC); sayaçlar o salondaki gelen/beklenen öğrenci sayısıdır.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Oturum, content: {application/json: {schema: {$ref: "#/components/schemas/CheckinSession"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /checkin-sessions/{id}/code:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Yedek 6 haneli kodu yenile (eski kod geçersiz olur)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Oturum, content: {application/json: {schema: {$ref: "#/components/schemas/CheckinSession"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /checkin-sessions/{id}/close:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Oturumu kapat (QR ve kod çalışmaz)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Kapatıldı}
        "404": {$ref: "#/components/responses/NotFound"}
  /me/checkin:
    post:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Öğrenci QR veya 6 haneli kodla kendini yoklamaya yazar (student)
      description: |
        `token` (QR'dan) ya da `code` (6 hane) — yalnız biri. Öğrencinin o salon+slotta koltuğu olmalı.
        Onaylı mazereti varsa 409 (`excused`). Hatalı kod denemesi kullanıcı başına 5 dk'da 8 ile sınırlıdır (429).
        Tekrar okutma zararsızdır (`already_present: true`).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {token: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}}}}
      responses:
        "200": {description: Yoklamaya yazıldı, content: {application/json: {schema: {$ref: "#/components/schemas/CheckinResult"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
        "429": {description: Çok fazla hatalı deneme}
  /exams/{id}/attendance:
    get:
      tags: [Yoklama ve sınav kartı (F-7, T-5)]
      summary: Sınavın yoklama durumu ve özeti (keyset)
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/After"}]
      responses:
        "200": {description: Özet ve sayfa, content: {application/json: {schema: {type: object, properties: {summary: {$ref: "#/components/schemas/AttendanceSummary"}, items: {type: array, items: {type: object}}, next_cursor: {type: string, nullable: true}}}}}}
  /attendance/conflicts:
    get:
      tags: [Mazeret (F-6)]
      summary: Yoklama çakışmaları (iki cihaz farklı durum)
      parameters:
        - {name: exam_id, in: query, schema: {type: integer, format: int64}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/After"}
      responses:
        "200": {description: Sayfa, content: {application/json: {schema: {$ref: "#/components/schemas/Page"}}}}
  /schedules/simulate:
    post:
      tags: [Ek özellikler (Faz 11)]
      summary: Hızlı simülasyon — T-1'i kaydetmeden çalıştır
      description: Yalnızca takvimi (T-1) hesaplar; hiçbir şey yazmaz. Yayındaki sürümün metrikleriyle birlikte döner. En çok 300.000 iterasyon.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [period_id, iterations], properties: {period_id: {type: integer, format: int64}, seed: {type: integer, format: int64}, iterations: {type: integer, minimum: 1, maximum: 300000}, scope: {type: object, description: "Sınav provası kapsamı: fakülte → bölümler → sınıflar (1–4). Boş alan = süzme yok.", properties: {faculty_id: {type: integer, format: int64}, department_ids: {type: array, items: {type: integer, format: int64}}, years: {type: array, items: {type: integer, minimum: 1, maximum: 4}}}}}}}}
      responses:
        "200": {description: "Simülasyon sonucu (saved=false)", content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /schedules/compare:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: İki sürümü karşılaştır (metrikler + taşınan sınavlar)
      parameters:
        - {name: a, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: b, in: query, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Karşılaştırma, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /activity:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Etkinlik akışı / denetim kaydı (yeniden eskiye; süzülebilir, artımlı okunabilir)
      description: |
        `after_id` yalnız daha yeni kayıtları döner (canlı akış için artımlı yoklama); `before_id` daha eskileri (sayfalama,
        yanıttaki `next_before`). İkisi birlikte verilemez. `latest_id` denetim kaydındaki en yeni kimliktir.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: action, in: query, description: "Eylem ön eki, örn. excuse.", schema: {type: string, maxLength: 40}}
        - {name: actor, in: query, schema: {type: integer, format: int64}}
        - {name: after_id, in: query, schema: {type: integer, format: int64}}
        - {name: before_id, in: query, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Etkinlikler, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}, latest_id: {type: integer}, next_before: {type: integer, nullable: true}}}}}}
        "422": {$ref: "#/components/responses/Validation"}
  /faculties:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Fakülteler, bölümleri (öğrenci/ders sayısı, sınıflar) ve öğretim üyeleri
      responses:
        "200": {description: Fakülteler, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
  /schedules/{id}/live:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Canlı yoklama özeti (salon bazlı)
      description: |
        Bir oturumdaki her salon için oturan / gelen / gelmedi / işaretlenmemiş sayıları, son olay zamanı, cihaz sayısı,
        sınav payları ve gözetmenler. `slot_id` verilmezse süren oturum, yoksa sıradaki, yoksa son biten seçilir
        (`slot.mode`: active | upcoming | past). Yoklama, olaylardan türetilen son durumdan okunur.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: slot_id, in: query, schema: {type: integer, format: int64}}
      responses:
        "200": {description: Canlı özet, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/live/events:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Canlı yoklama olay akışı (yeniden eskiye, artımlı)
      description: Oturumdaki ham yoklama olayları (QR/elle, cihaz, öğrenci, salon). `since` verilirse yalnız daha yeni `received_at`.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: slot_id, in: query, schema: {type: integer, format: int64}}
        - {name: since, in: query, description: RFC 3339, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 30}}
      responses:
        "200": {description: Olaylar, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /me/exams/{examId}/seatmap:
    get:
      tags: [Öğrenci]
      summary: Salon krokisi ve kendi koltuğum (başka öğrenci verisi yok)
      parameters: [{name: examId, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        "200": {description: Kroki, content: {application/json: {schema: {type: object}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /periods/{id}/slots:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Dönemin tüm sınav oturumları (slotlar)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Slotlar, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/export:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Takvimi Excel (.xlsx) veya CSV olarak indir
      description: xlsx iki sayfa içerir (Takvim, Gözetmenler). CSV UTF-8 BOM'lu ve noktalı virgüllüdür (Türkçe Excel).
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: format, in: query, schema: {type: string, enum: [xlsx, csv], default: xlsx}}
      responses:
        "200": {description: Dosya, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}, text/csv: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /schedules/{id}/calendar.ics:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Tüm sınavlar iCalendar (.ics)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: iCalendar, content: {text/calendar: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /schedules/{id}/exams/{examId}/move:
    post:
      tags: [Ek özellikler (Faz 11)]
      summary: Sınavı başka slota taşı (sürükle-bırak düzenleme)
      description: |
        `dry_run=true` yalnızca doğrular (yazmaz). Aksi halde sert kısıtlar (aynı slotta çakışma, günlük sınır, slot kapasitesi)
        sağlanıyorsa salon/oturma/gözetmen planı yeniden kurulur ve kaynak sürüm DEĞİŞMEDEN yeni bir taslak sürüm oluşur (201).
        İhlalde 422 `constraint_violation` ve neden listesi; hiçbir şey değişmez.
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {name: examId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [slot_id], properties: {slot_id: {type: integer, format: int64}, dry_run: {type: boolean}}}}}
      responses:
        "200": {description: "dry_run sonucu (ok, ihlaller, ceza farkı)", content: {application/json: {schema: {type: object}}}}
        "201": {description: Yeni taslak sürüm, content: {application/json: {schema: {type: object}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
  /me/exams.ics:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Öğrencinin sınavları iCalendar (salon ve koltukla)
      responses:
        "200": {description: iCalendar, content: {text/calendar: {schema: {type: string}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /me/duties.ics:
    get:
      tags: [Ek özellikler (Faz 11)]
      summary: Gözetmenin görevleri iCalendar
      responses:
        "200": {description: iCalendar, content: {text/calendar: {schema: {type: string}}}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    Limit: {name: limit, in: query, description: "1–200, varsayılan 50", schema: {type: integer, minimum: 1, maximum: 200}}
    After: {name: after, in: query, description: "Önceki yanıttaki next_cursor (opak)", schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 200}}
  responses:
    Unauthorized: {description: Kimlik doğrulaması yok veya geçersiz, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: Bu işlem için yetki yok, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: Kayıt bulunamadı, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: Durum çakışması, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Validation: {description: Girdi doğrulaması başarısız, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  schemas:
    CheckinSession:
      type: object
      properties:
        id: {type: integer}
        slot_id: {type: integer}
        room_id: {type: integer}
        room_code: {type: string}
        code: {type: string, description: Yedek 6 haneli kod}
        code_expires_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        present: {type: integer}
        expected: {type: integer}
        token: {type: string, description: Dönen QR'ın içeriği}
        token_expires_at: {type: string, format: date-time}
    CheckinResult:
      type: object
      properties:
        exam_id: {type: integer}
        course_code: {type: string}
        course_name: {type: string}
        room_code: {type: string}
        already_present: {type: boolean}
        method: {type: string, enum: [qr, code]}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: validation_failed}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object}}
        next_cursor: {type: string, nullable: true}
    Health:
      type: object
      properties:
        status: {type: string, enum: [healthy, unhealthy]}
        version: {type: string}
        dependencies: {type: object, additionalProperties: {type: object, properties: {status: {type: string}, message: {type: string}}}}
    LoginRequest:
      type: object
      required: [email, password]
      properties: {email: {type: string, example: seed.mercan@ddo-case.invalid}, password: {type: string, format: password}}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    UserView:
      type: object
      properties:
        id: {type: integer}
        roles: {type: array, items: {type: string, enum: [secretary, lecturer, invigilator, student_affairs, student]}}
        student_id: {type: integer}
        lecturer_id: {type: integer}
    TokenResponse:
      type: object
      properties:
        access_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time}
        token_type: {type: string, example: Bearer}
        user: {$ref: "#/components/schemas/UserView"}
    Period:
      type: object
      properties: {id: {type: integer}, name: {type: string}, kind: {type: string}, start_date: {type: string, format: date-time}, days: {type: integer}, sessions_per_day: {type: integer}, exams: {type: integer}}
    ImportReport:
      type: object
      properties:
        kind: {type: string}
        rows: {type: integer}
        valid: {type: integer}
        created: {type: integer}
        updated: {type: integer}
        unchanged: {type: integer}
        errors: {type: array, items: {type: object, properties: {line: {type: integer}, field: {type: string}, message: {type: string}}}}
        errors_truncated: {type: boolean}
    RoomInput:
      type: object
      required: [code, building, floor, type, rows, cols]
      properties:
        code: {type: string, maxLength: 20}
        building: {type: string}
        floor: {type: integer}
        type: {type: string, enum: [classic, lab]}
        rows: {type: integer, minimum: 1, maximum: 40}
        cols: {type: integer, minimum: 1, maximum: 40}
        inactive_seats: {type: array, items: {type: array, items: {type: integer}, minItems: 2, maxItems: 2}, description: "[satır, sütun] (0 tabanlı)"}
        accessible_seats: {type: array, items: {type: array, items: {type: integer}, minItems: 2, maxItems: 2}}
        door_side: {type: string, enum: [front, back, left, right], description: "Kapının duvarı (front = 0. sıranın duvarı); boşsa front"}
        door_pos: {type: integer, minimum: 0, description: "Duvar boyunca 0 tabanlı konum (front/back: sütun, left/right: sıra)"}
    RoomDetail:
      type: object
      properties:
        id: {type: integer}
        code: {type: string}
        building: {type: string}
        floor: {type: integer}
        type: {type: string}
        rows: {type: integer}
        cols: {type: integer}
        capacity: {type: integer}
        door_side: {type: string, enum: [front, back, left, right]}
        door_pos: {type: integer}
        accessible_seats: {type: integer}
        seats: {type: array, items: {type: object, properties: {id: {type: integer}, row: {type: integer}, col: {type: integer}, active: {type: boolean}, accessible: {type: boolean}}}}
    CreateScheduleRequest:
      type: object
      required: [period_id]
      properties:
        period_id: {type: integer}
        seed: {type: integer, default: 42}
        iterations: {type: integer, minimum: 0, maximum: 2000000, default: 0}
        front_load: {type: integer, minimum: 0, maximum: 100, default: 0, description: "Büyük sınavı (≥100 öğrenci) erken güne alma ceza ağırlığı; 0 = kapalı (ADR-022)"}
    JobAccepted:
      type: object
      properties: {job_id: {type: integer}, status: {type: string, example: queued}, status_url: {type: string}}
    Job:
      type: object
      properties:
        id: {type: integer}
        period_id: {type: integer}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        params: {type: object}
        result: {type: object, description: "Başarılıysa {schedule_id, version, report}; başarısızsa çözümsüzlük raporu"}
        error: {type: string}
        schedule_id: {type: integer}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Schedule:
      type: object
      properties:
        id: {type: integer}
        period_id: {type: integer}
        version: {type: integer}
        status: {type: string, enum: [draft, published]}
        seed: {type: integer}
        metrics: {type: object, description: "Ceza, ardışık gün/aynı gün sayıları, salon sayısı, gözetmen adaleti"}
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
    StudentExams:
      type: object
      properties:
        student_id: {type: integer}
        items: {type: array, items: {type: object, properties: {exam_id: {type: integer}, course_code: {type: string}, course_name: {type: string}, starts_at: {type: string, format: date-time}, ends_at: {type: string, format: date-time}, duration_minutes: {type: integer}, room_code: {type: string, nullable: true}, building: {type: string, nullable: true}, seat_row: {type: integer, nullable: true}, seat_col: {type: integer, nullable: true}}}}
    ExamCard:
      type: object
      properties:
        card: {type: object}
        student_id: {type: integer}
        qr_token: {type: string, description: "Tek kullanımlık; veritabanında yalnız özeti saklanır"}
        expires_at: {type: string, format: date-time}
    RemoveInvigilatorResult:
      type: object
      properties:
        vacated: {type: integer, description: "Boşalan görev sayısı (değişiklik sayısının alt sınırı)"}
        swaps: {type: integer}
        changes: {type: array, items: {type: object, properties: {duty_id: {type: integer}, from: {type: integer}, to: {type: integer}}}}
        unfilled: {type: array, items: {type: object, properties: {duty_id: {type: integer}, missing: {type: integer}}}}
        violations: {type: integer}
    RoomChangeRequest:
      type: object
      required: [slot_id, from_room_id, to_room_id, reason]
      properties: {slot_id: {type: integer}, from_room_id: {type: integer}, to_room_id: {type: integer}, reason: {type: string, example: yangın tatbikatı}}
    ExcuseRequest:
      type: object
      required: [reason]
      properties:
        exam_id: {type: integer, description: "Öğrenci için"}
        slot_id: {type: integer, description: "Gözetmen için"}
        reason: {type: string, minLength: 5, maxLength: 1000}
    DecisionRequest:
      type: object
      required: [decision]
      properties: {decision: {type: string, enum: [approved, rejected]}, note: {type: string, maxLength: 1000}}
    Excuse:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string, enum: [student, invigilator]}
        student_id: {type: integer}
        user_id: {type: integer}
        exam_id: {type: integer}
        slot_id: {type: integer}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, rejected]}
        decided_by: {type: integer}
        decided_at: {type: string, format: date-time}
        decision_note: {type: string}
        created_at: {type: string, format: date-time}
    SyncRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [event_id, device_id, exam_id, student_id, status, source, hlc]
            properties:
              event_id: {type: string, format: uuid, description: "UUIDv7"}
              device_id: {type: string}
              exam_id: {type: integer}
              student_id: {type: integer}
              status: {type: string, enum: [present, absent]}
              source: {type: string, enum: [qr, manual]}
              hlc: {type: object, properties: {wall: {type: integer, description: ms}, counter: {type: integer}}}
    SyncResult:
      type: object
      properties:
        accepted: {type: integer}
        duplicates: {type: integer}
        new_conflicts: {type: integer}
        rejected: {type: array, items: {type: object, properties: {event_id: {type: string}, reason: {type: string}}}}
    QRUseRequest:
      type: object
      required: [token, device_id]
      properties: {token: {type: string}, device_id: {type: string}}
    AttendanceSummary:
      type: object
      properties: {enrolled: {type: integer}, present: {type: integer}, absent: {type: integer}, conflicts: {type: integer}}
